# Als Vorlage für die eigene ESPHome-secrets.yaml verwenden.
# Nie die eigene secrets.yaml in Git einchecken.
wifi_ssid: "WLAN-Name"
wifi_password: "Sicheres-WLAN-Passwort"
# Für ein privates Repository einen Fine-grained Token nur mit Contents: Read
# einsetzen. "GH_READ_TOKEN" durch den echten Token ersetzen.
kb35_repository_url: "https://x-access-token:GH_READ_TOKEN@github.com/Pommel4711/midea-ac.git"
api_key: "BASE64_API_ENCRYPTION_KEY"
ota_password: "Sicheres-OTA-Passwort"
fallback_password: "Sicheres-Fallback-AP-Passwort"
kb35_web_server_username: "admin"
kb35_web_server_password: "Eigenes-langes-Web-Passwort"
