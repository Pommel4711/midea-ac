title: Klimaanlage
views:
  - title: Splitanlage 1. OG
    path: splitanlage-1og
    icon: mdi:air-conditioner
    type: sections
    max_columns: 2
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          # Alle Entitäts-IDs sind Beispielwerte. Siehe docs/ENTITY-CONTRACT.md.
          - type: custom:kb35-climate-dashboard-card
            title: Splitanlage 1. OG
            climate_entity: climate.splitanlage_1og
            fan_entity: fan.splitanlage_1og_luefter
            fan_auto_preset: Auto
            switches:
              display: switch.splitanlage_1og_display
              boost: switch.splitanlage_1og_boost
              sleep: switch.splitanlage_1og_sleep
              frost: switch.splitanlage_1og_frostschutz
              beeper: switch.splitanlage_1og_piepton
            selects:
              power_limit: select.splitanlage_1og_leistungsbegrenzung
            sensors:
              outdoor_temperature: sensor.splitanlage_1og_aussentemperatur
              communication: binary_sensor.splitanlage_1og_kommunikation
              error_code: sensor.splitanlage_1og_fehlercode
      - type: grid
        cards:
          - type: history-graph
            title: Temperaturverlauf
            hours_to_show: 12
            entities:
              - entity: climate.splitanlage_1og
                name: Raumtemperatur
              - entity: sensor.splitanlage_1og_aussentemperatur
                name: Außentemperatur
          - type: entities
            title: Diagnose
            show_header_toggle: false
            entities:
              - entity: binary_sensor.splitanlage_1og_kommunikation
                name: Kommunikation
              - entity: sensor.splitanlage_1og_aussentemperatur
                name: Außentemperatur
              - entity: sensor.splitanlage_1og_fehlercode
                name: Fehlercode
