# Nur verwenden, wenn das optionale Custom-Dashboard später gewünscht ist.
# Den Block in /config/configuration.yaml unterhalb von lovelace: ergänzen.
# Existiert lovelace: bereits, nur resources: und dashboards: ergänzen.
lovelace:
  resource_mode: yaml
  resources:
    - url: /local/kb35-climate-dashboard-card.js?v=0.2.0
      type: module
  dashboards:
    kb35-klimaanlage:
      mode: yaml
      filename: lovelace/kb35-klimaanlage.yaml
      title: Klimaanlage
      icon: mdi:air-conditioner
      show_in_sidebar: true
